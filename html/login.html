<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./static/plugins/bootstrap-5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .c1{
            width: 30%;
            height: 400px;
            margin: 100px auto;
            padding-top: 20px;
        }
        .center{
            text-align: center;
        }
        .c2 {
            background-color: #ffffff;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-shadow: 5px 5px 20px #aaa;
        }
        .c3{
            width: 90%;
            margin: 0 auto;
        }
        .c4{
            margin: 0 auto;
            position:relative
        }
        .c5{
            position: absolute;
            top:38px;
            color:red;
            font-size: 12px;
        }
        .c6{
            padding-left: 0;
        }
    </style>

</head>
<body>

<div class="container c1 c2">
    <form id="data">
        <div class="c3">
            <div class="mb-3 center">
                <h4>用户登录</h4>
            </div>
            <div class="row mb-1">
                <label>用户名</label>
            </div>
            <div class="row mb-3 c4">
                <input type="text" class="form-control" placeholder="用户名">
                <span class="c5"></span>
            </div>

            <div class="row mb-1">
                <label>密码</label>
            </div>
            <div class="row mb-3 c4">
                <input type="password" class="form-control" placeholder="密码">
                <span class="c5"></span>
            </div>

            <div class="row mb-1">
                <label>图片验证码</label>
            </div>
            <div class="row mb-4 c4">
                <div class="col-sm-7  c6">
                    <input type="text" class="form-control" placeholder="验证码" id="code">
                </div>

                <div class="col-sm-5">
                    <img src="http://127.0.0.1:8000/myapp/image/code/">
                </div>
                <div>
                    <span class="c5"></span>
                </div>
            </div>



            <div class="center">
                <button type="submit" class="btn btn-primary" id="submit">登录</button>
            </div>
        </div>
    </form>
</div>
<script src="./static/js/jquery-4.0.0.min.js"></script>
<script>
    $(function (){
        $('#submit').click(function (){
            $.ajax({
                url:'/task/ajax/',
                type:'post',
                data:$('#data').serialize(),   //自动将表单里的值获取到并打包
                dataType:'JSON',    //内部拿到字符串会给字符串转换为前端的对象，方便取值
                success:function (res){
                    console.log(res);
                }
            })
        })
    })
</script>
</body>
</html>
