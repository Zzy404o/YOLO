<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./static/plugins/bootstrap-5.3.8/css/bootstrap.min.css">
    <style>
        .c1 {
            width: 30%;
            height: 400px;
            margin: 100px auto;
            padding-top: 20px;
        }

        .center {
            text-align: center;
        }

        .c2 {
            background-color: #ffffff;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-shadow: 5px 5px 20px #aaa;
        }

        .c3 {
            width: 90%;
            margin: 0 auto;
        }

        .c4 {
            margin: 0 auto;
            position: relative
        }

        .c5 {
            position: absolute;
            top: 38px;
            color: red;
            font-size: 12px;
        }

        .c6 {
            padding-left: 0;
        }
    </style>

</head>
<body>

<div class="container c1 c2">

    <div class="c3">
        <div class="mb-3 center">
            <h4>用户登录</h4>
        </div>
        <form id="data">
            <div class="row mb-1">
                <label>用户名</label>
            </div>
            <div class="row mb-3 c4">
                <input type="text" class="form-control" placeholder="用户名" name="username">
                <span class="c5"></span>
            </div>

            <div class="row mb-1">
                <label>密码</label>
            </div>
            <div class="row mb-3 c4">
                <input type="password" class="form-control" placeholder="密码" name="pwd">
                <span class="c5"></span>
            </div>

            <div class="row mb-1">
                <label>图片验证码</label>
            </div>
            <div class="row mb-4 c4">
                <div class="col-sm-7  c6">
                    <input type="text" class="form-control" placeholder="验证码" name="code">
                </div>

                <div class="col-sm-5">
                    <img id="codeImg" title="点击刷新">
                </div>
                <div>
                    <span class="c5"></span>
                </div>
            </div>
        </form>


        <div class="center">
            <button type="button" class="btn btn-primary" id="submit">登录</button>
        </div>
    </div>

</div>
<script src="./static/js/jquery-4.0.0.min.js"></script>
<script>

    function refreshCode() {
        let xhr = new XMLHttpRequest();
        xhr.open('get', 'http://localhost:8000/myapp/image/code/');
        xhr.withCredentials = true;
        xhr.responseType = 'blob';
        xhr.onload = function () {
            if (xhr.status == 200) {
                let url = URL.createObjectURL(xhr.response);
                document.getElementById('codeImg').src = url;
            }
        };
        xhr.send();
    }
    refreshCode();
    document.getElementById('codeImg').onclick = function() {
        refreshCode();
    }

    $(function () {
        $('#submit').click(function () {
            $.ajax({
                url: 'http://localhost:8000/myapp/login/',
                type: 'post',
                data: $('#data').serialize(),
                dataType: 'JSON',
                xhrFields: { withCredentials: true },
                success: function (res) {
                    let e = $('.c5')
                    for (let i = 0; i < 3; i++) {
                        e.eq(i).text('');
                    }

                    if (res.status == 1) {
                        let errors = res.error;
                        if (errors.username) e.eq(0).text(errors.username[0]);
                        if (errors.pwd) e.eq(1).text(errors.pwd[0]);
                        if (errors.code) e.eq(2).text(errors.code[0]);
                    } else if (res.status == 4) {
                        e.eq(2).text(res.error);
                    } else if (res.status == 5) {
                        e.eq(1).text(res.error);
                    } else {
                        location.href = 'task_list.html';
                    }
                },
                error: function (xhr) {
                    console.error('请求失败:', xhr.status, xhr.responseText);
                }
            })
        })
    })
</script>
</body>
</html>
