<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>标注任务列表</title>
    <link rel="stylesheet" href="./static/plugins/bootstrap-5.3.8/css/bootstrap.min.css">
    <style>
        .interval {
            margin: 20px 0;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="#">标注管理系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/task/list/">任务列表</a>
                </li>
            </ul>
            <ul class="navbar-nav ">

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">

                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">个人资料</a></li>
                        <li><a class="dropdown-item" href="#">我的信息</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" href="/logout/">退出</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="interval">
    <div class="container">
    <div class="card">
        <div class="card-header">
            任务列表
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">标题</th>
                    <th scope="col">创建人</th>
                    <th scope="col">数量</th>
                    <th scope="col">文件</th>
                </tr>
                </thead>
                <tbody id="datalist">

                </tbody>
            </table>
        </div>
    </div>
</div>
</div>

<script>
    let xml = new XMLHttpRequest();
    xml.open('get','http://127.0.0.1:8000/myapp/task/list/');
    xml.withCredentials = true;   // 跨域携带登录 Cookie
    xml.send();
    xml.onreadystatechange = function (){
        if(xml.status == 200 && xml.readyState == 4){
            let res = xml.responseText;
            let datas = JSON.parse(res).results
            let datalist = document.getElementById("datalist");
            for(let i in datas){
                let info = datas[i];

                let tr = document.createElement("tr");
                datalist.appendChild(tr);

                ctd(tr,info,'title');
                ctd(tr,info,'creator');
                ctd(tr,info,'num');
                ctd(tr,info,'task_file');

            }
        }
    }
    function ctd(tr,data,text){
        let td = document.createElement('td');
        if(text == 'task_file'){
            td.innerHTML = '<a href="'+data[text]+'">'+'点击下载'+'</a>'
        }else {
            td.innerText = data[text];
        }
        tr.appendChild(td)
    }
</script>

</body>
</html>
