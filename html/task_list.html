<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>标注任务列表</title>
    <link rel="stylesheet" href="./static/plugins/bootstrap-5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
<div id="nav"></div>
<div class="interval">
    <div class="container">
        <div class="card">
            <div class="card-header">
                任务列表
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th scope="col">标题</th>
                        <th scope="col">创建人</th>
                        <th scope="col">数量</th>
                        <th scope="col">文件</th>
                        <th scope="col">详情</th>
                        <th scope="col">创建时间</th>
                        <th scope="col">标注员</th>
                        <th scope="col">操作</th>
                    </tr>
                    </thead>
                    <tbody id="datalist">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="getModal" tabindex="-1" aria-labelledby="exampleModalLiveLabel"
     style="display: none;" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h1 class="modal-title fs-5" id="exampleModalLiveLabel">是否领取该任务</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>领取任务后，需在7个工作日内提交，否则自动过期</p>
                <p style="color: red">多次领取不提交将拉入黑名单</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="getTask">确定</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="backModal" tabindex="-1" aria-labelledby="backModalLiveLabel"
     style="display: none;" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h1 class="modal-title fs-5" id="backModalLiveLabel">是否归还该任务</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>归还任务后，1个工作日内不得再次领取</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="backTask">确定</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="submitModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
     aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">提交</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formAdd">
                    <div class="input-group">
                        <div>
                            <textarea class="form-control" placeholder="备注" name="txt"></textarea>
                        </div>
                        <div class="interval c4">
                            <input type="file" class="form-control" id="addFile"
                                   aria-describedby="inputGroupFileAddon04" aria-label="Upload" name="commit_zip">
                            <span class="c5"></span>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button id="btnSubmit" type="button" class="btn btn-primary">提交</button>
            </div>
        </div>
    </div>
</div>

<script src="./static/plugins/bootstrap-5.3.8/js/bootstrap.bundle.js"></script>
<script src="./static/js/common.js"></script>
<script>
    const getModal = new bootstrap.Modal('#getModal', {
        keyboard: false
    })
    const submitModal = new bootstrap.Modal('#submitModal', {
        keyboard: false
    })
    const backModal = new bootstrap.Modal('#backModal', {
        keyboard: false
    })
    let taskId = null;

    window.onUserInfoReady = function () {
        let xml = new XMLHttpRequest();
        xml.open('get', 'http://localhost:8000/myapp/task/list/');
        xml.withCredentials = true;   // 跨域携带登录 Cookie
        xml.send();
        xml.onreadystatechange = function () {
            if (xml.status == 200 && xml.readyState == 4) {
                let res = xml.responseText;
                let datas = JSON.parse(res).results
                let datalist = document.getElementById("datalist");
                for (let i in datas) {
                    let info = datas[i];

                    let tr = document.createElement("tr");
                    datalist.appendChild(tr);

                    ctd(tr, info, 'title');
                    ctd(tr, info, 'creator');
                    ctd(tr, info, 'num');
                    ctd(tr, info, 'task_file');
                    ctd(tr, info, 'detail');
                    ctd(tr, info, 'create_time');
                    ctd(tr, info, 'person');

                    let td = document.createElement('td');
                    td.innerHTML = '<a href="#" class="btn btn-primary btn-sm get">领取</a> '
                    tr.appendChild(td);
                    let status = info.status;

                    if (status == 2 && username == info.person) {
                        td.innerHTML = '<a href="#" class="btn btn-light btn-sm back">归还</a>' +
                            '<a href="#" class="btn btn-success btn-sm submit">提交</a>'
                    } else if (status == 2 && username != info.person) {
                        td.innerHTML = '<p style="color:green;">已被领取</p>'
                    } else if (status == 3) {
                        td.innerHTML = '<p style="color: #6c757d">已提交</p>'
                    } else if (status == 4){
                        td.innerHTML = '<p style="color: #6c757d">已完成</p>'
                    }else {
                        let get = td.querySelector(".get");
                        get.onclick = function () {
                            taskId = info.id
                            getModal.show();
                        }
                    }

                    if (status == 2 && username == info.person) {
                        let back = td.querySelector(".back");
                        let submit = td.querySelector(".submit");
                        if (username == info.person) {
                            back.onclick = function () {
                                taskId = info.id
                                backModal.show();
                            }
                            submit.onclick = function () {
                                taskId = info.id
                                submitModal.show();
                            }
                        }
                    }
                }
            }
        }
    }

    let yes = document.getElementById('getTask');
    yes.onclick = function () {
        let form = new XMLHttpRequest();
        form.open('PATCH', 'http://localhost:8000/myapp/task/set/' + taskId + '/');
        form.withCredentials = true;
        form.setRequestHeader("Content-Type", "application/json");
        let sendData = {
            "status": 2
        };
        form.send(JSON.stringify(sendData));
        form.onreadystatechange = function () {
            if (form.readyState != 4) return;
            if (form.status == 200) {
                window.location.reload();
            } else {
                alert("领取失败：" + form.status + " " + form.responseText);
            }
        }
    }

    let sure = document.getElementById('backTask');
    sure.onclick = function () {
        let form = new XMLHttpRequest();
        form.open('PATCH', 'http://localhost:8000/myapp/task/set/' + taskId + '/');
        form.withCredentials = true;
        form.setRequestHeader("Content-Type", "application/json");
        let sendData = {
            "status": 1,
        };
        form.send(JSON.stringify(sendData));
        form.onreadystatechange = function () {
            if (form.readyState != 4) return;
            if (form.status == 200) {
                window.location.reload();
            } else {
                alert("归还失败：" + form.status + " " + form.responseText);
            }
        }
    }

    let ddl = document.getElementById('btnSubmit');
    ddl.onclick = function () {
        let add = document.getElementById('formAdd');
        let fd = new FormData(add);
        fd.append("task", taskId);
        let form = new XMLHttpRequest();
        form.withCredentials = true;
        form.open('POST', 'http://localhost:8000/myapp/commit/list/')
        form.withCredentials = true;
        let addfile = document.getElementById('addFile')
        let error = document.getElementsByClassName("c5")[0];
        form.onreadystatechange = function () {
            if (form.readyState != 4) return;
            if (form.status == 201) {
                let res = JSON.parse(form.responseText);
                console.log(res)
                add.reset();
                addfile.value = null;

                let status = new XMLHttpRequest();
                status.open('PATCH', 'http://localhost:8000/myapp/task/set/' + taskId + '/');
                status.withCredentials = true;
                status.setRequestHeader("Content-Type", "application/json");
                let sendData = {
                    "status": 3,
                };
                status.send(JSON.stringify(sendData));

                submitModal.hide();
                window.location.reload();
            } else if (form.status == 200) {
                let res = JSON.parse(form.responseText);
                error.innerText = typeof res.error === 'string' ? res.error : res.error['commit_zip'];
                addfile.value = null;
            } else {
                error.innerText = "服务器异常:" + form.status;
            }
        }
        form.send(fd);
    }

    function ctd(tr, data, text) {
        let td = document.createElement('td');
        if (text == 'task_file') {
            td.innerHTML = '<a href="' + data[text] + '">' + '点击下载' + '</a>'
        } else if (text == 'detail') {
            td.style.width = '20%'
            td.innerText = '点击查看详情'
            let show = 0
            td.onclick = function () {
                if (show == 0) {
                    this.innerText = data[text];
                    show = 1;
                } else {
                    this.innerText = '点击查看详情';
                    show = 0;
                }
            }
        } else if (text == 'person') {
            td.style.width = '15%'
            if (data['status'] == 1) {
                td.innerText = '暂无';
            } else {
                td.innerText = data['person'];
            }
        } else {
            td.innerText = data[text];
        }
        tr.appendChild(td)
    }
</script>

</body>
</html>
